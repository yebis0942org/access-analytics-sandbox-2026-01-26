<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Pulseboard</title>
    <meta
      name="description"
      content="架空SaaSのデモ相談フォーム。計測テスト用のCTAとフォームがあります。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <!-- Tracking tags will be inserted here (Microsoft Clarity / Google Analytics) -->
  </head>
  <body>
    <!-- Tracking tags will be inserted here (noscript or body tags) -->
    <header class="site-header">
      <div class="container nav">
        <a class="logo" href="index.html">Pulseboard</a>
        <nav class="nav-links" aria-label="Primary">
          <a href="index.html">Home</a>
          <a href="features.html">Features</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <span class="pill">Request a Demo</span>
          <h1 class="section-title">デモ相談を始めましょう</h1>
          <p class="section-lead">
            下記フォームはテスト用です。送信後の実処理はありませんが、
            ボタン操作や入力などの計測ができます。
          </p>

          <form class="form tone-block reveal" action="#" method="post">
            <label>
              会社名
              <input class="input" type="text" name="company" placeholder="Pulseboard Inc." />
            </label>
            <label>
              お名前
              <input class="input" type="text" name="name" placeholder="山田 太郎" />
            </label>
            <label>
              メールアドレス
              <input class="input" type="email" name="email" placeholder="you@example.com" />
            </label>
            <label>
              相談内容
              <textarea class="textarea" name="message" placeholder="計測したい行動や目的を簡単に"></textarea>
            </label>
            <button class="button primary" type="submit">送信して相談する</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>Pulseboard (架空サービス) / Contact page for analytics testing</p>
      </div>
    </footer>

    <script src="assets/main.js" defer></script>
  </body>
</html>
